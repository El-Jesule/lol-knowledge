name: CI

on:
  push:
    branches: [main, dev, integration]
  pull_request:
    branches: [main, dev, integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install development dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run main test suite
        run: python -m pytest -q

      - name: Run research test suite
        run: python -m pytest research/tests -q

      - name: Check lint with ruff
        run: python -m ruff check .

      - name: Check formatting with ruff
        run: python -m ruff format --check .

      - name: Validate snapshot and knowledge base
        run: python -m lol_knowledge validate
